<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سیستم عامل وب</title>
    <link href="./assets/css/style.css" rel="stylesheet">
    <script src="./lib/lucide.js"></script>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col bg-[url('https://images.unsplash.com/photo-1557683316-973673baf926?q=80&w=2000&auto=format&fit=crop')] bg-cover bg-center font-vazir text-sm text-gray-800">

    <div id="desktop" class="flex-1 relative w-full h-full p-2">
        <div id="desktop-icons" class="absolute inset-0 w-full h-full">
        </div>
        <div id="window-area" class="absolute inset-0 pointer-events-none z-10 overflow-hidden">
        </div>
    </div>

    <div id="context-menu" class="hidden absolute bg-white/80 glass shadow-2xl border border-white/40 rounded-xl py-1 w-52 z-[9999] transition-opacity duration-150 backdrop-blur-xl">
    </div>

    <div id="taskbar" class="h-16 bg-gray-900/60 glass text-white flex items-center justify-between px-4 z-[9999] shadow-[0_-10px_40px_rgba(0,0,0,0.3)] border-t border-white/10">
        <div class="flex items-center gap-2 h-full">
            <button id="start-btn" class="w-10 h-10 hover:bg-white/20 rounded-xl transition duration-200 flex items-center justify-center group">
                <i data-lucide="layout-grid" class="w-6 h-6 text-blue-400 group-hover:scale-110 transition"></i>
            </button>
            <div class="w-[1px] h-8 bg-white/20 mx-2"></div>
            <div id="taskbar-apps" class="flex items-center gap-2 overflow-x-auto h-full px-2">
            </div>
        </div>
        
        <div id="taskbar-clock" class="px-4 py-1.5 hover:bg-white/10 rounded-xl cursor-default text-center flex flex-col items-center justify-center transition">
        </div>
    </div>

    <script type="module" src="./core/main.js"></script>
</body>
</html>
