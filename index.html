<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سیستم عامل وب</title>
    <link href="./assets/css/style.css" rel="stylesheet">
    <script src="./lib/lucide.js"></script>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col bg-[url('https://images.unsplash.com/photo-1557683316-973673baf926?q=80&w=2000&auto=format&fit=crop')] bg-cover bg-center font-vazir text-sm text-gray-800">

    <div id="desktop" class="flex-1 relative w-full h-full p-2">
        <div id="desktop-icons" class="absolute inset-0 w-full h-full">
        </div>
        <div id="window-area" class="absolute inset-0 pointer-events-none z-10 overflow-hidden">
        </div>
    </div>

    <div id="context-menu" class="hidden absolute bg-white/85 glass shadow-2xl border border-white/50 rounded-xl py-1 w-52 z-[9999] transition-opacity duration-150 backdrop-blur-2xl">
    </div>

    <div id="start-menu" class="hidden absolute bottom-20 right-4 w-72 bg-white/85 glass shadow-[0_10px_50px_rgba(0,0,0,0.3)] border border-white/50 rounded-2xl p-4 z-[9999] transition-all duration-300 translate-y-10 opacity-0 backdrop-blur-2xl">
        <div class="flex items-center gap-3 mb-4 border-b border-gray-200/60 pb-4">
            <div class="w-12 h-12 rounded-full bg-gradient-to-tr from-blue-500 to-purple-500 flex items-center justify-center text-white shadow-lg">
                <i data-lucide="user" class="w-6 h-6"></i>
            </div>
            <div>
                <div class="font-bold text-gray-800 text-base">کاربر مهمان</div>
                <div class="text-xs text-blue-600 font-medium mt-0.5">مدیر سیستم</div>
            </div>
        </div>
        <div class="text-xs font-bold text-gray-500 mb-3 px-1">برنامه‌های پین‌شده</div>
        <div id="start-menu-apps" class="grid grid-cols-3 gap-2">
        </div>
    </div>

    <div id="taskbar" class="h-16 bg-gray-900/60 glass text-white flex items-center justify-between px-4 z-[9999] shadow-[0_-10px_40px_rgba(0,0,0,0.4)] border-t border-white/10 backdrop-blur-2xl">
        <div class="flex items-center gap-2 h-full">
            <button id="start-btn" class="w-12 h-12 hover:bg-white/15 rounded-xl transition duration-200 flex items-center justify-center group active:scale-95">
                <i data-lucide="layout-grid" class="w-7 h-7 text-blue-400 group-hover:drop-shadow-[0_0_8px_rgba(96,165,250,0.8)] transition duration-300"></i>
            </button>
            <div class="w-[1px] h-8 bg-white/20 mx-2"></div>
            <div id="taskbar-apps" class="flex items-center gap-2 overflow-x-auto h-full px-2">
            </div>
        </div>
        
        <div id="taskbar-clock" class="px-4 py-1.5 hover:bg-white/10 rounded-xl cursor-default text-center flex flex-col items-center justify-center transition hover:shadow-inner">
        </div>
    </div>

    <script type="module" src="./core/main.js"></script>
</body>
</html>
